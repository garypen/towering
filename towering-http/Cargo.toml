[package]
name = "towering-http"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
apollo-compiler.workspace = true
apollo-federation.workspace = true
axum = "0.8.8"
bytes = "1.11.1"
extism = "1.21.0"
futures.workspace = true
hickory-resolver = "0.25.2"
http = "1.4.0"
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["full"] }
hyper-rustls = { version = "0.27.7", features = ["http2", "webpki-tokio"] }
rustls = { version = "0.23.37", default-features = false }
serde_json = { version = "1.0.149", features = [
    "preserve_order",
    "float_roundtrip",
] }
thiserror = "2.0.18"
tokio.workspace = true
tower.workspace = true
url = "2.5.8"

[dev-dependencies]
tower-test.workspace = true
