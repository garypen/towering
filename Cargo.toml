[workspace]
resolver = "2"

members = [
    "plugin",
    "towering",
    "towering-http",
    "towering-client",
    "towering-http-server",
    "towering-server"
]

default-members = [
    "towering",
    "towering-http",
    "towering-client",
    "towering-http-server",
    "towering-server"
]

[workspace.package]
version = "0.1.0"
authors = [
  "garypen <garypen@gmail.com>",
]
license = "Apache-2.0"
repository = "https://github.com/garypen/towering"
homepage = "https://github.com/garypen/towering"
documentation = "https://github.com/garypen/towering#readme"
edition = "2021"

[workspace.dependencies]
anyhow = "1.0.102"
apollo-compiler = "=1.31.1"
apollo-federation = "2.13.0"
apollo-parser = "0.8.5"
async-trait = "0.1.89"
clap = { version = "4.6.0", features = ["derive"] }
futures = "0.3.32"
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1.51.0", features = ["full"] }
tower = { version = "0.5.3", features = ["full"] }
tower-test = "0.4.0"
towering = { version = "0.1.0", path = "towering" }
towering-http = { version = "0.1.0", path = "towering-http" }
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.23.0", features = ["v4"] }
