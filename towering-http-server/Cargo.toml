[package]
name = "towering-http-server"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow.workspace = true
apollo-compiler.workspace = true
apollo-federation.workspace = true
axum = "0.8.8"
clap = { workspace = true, features = ["derive"] }
http = "1.4.0"
hyper = { version = "1.9.0", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["full"] }
rustls = { version = "0.23.37", default-features = false }
tower-http = { version = "0.6.8", features = ["full"] }
tokio.workspace = true
tower.workspace = true
towering-http.workspace = true
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
tower-test.workspace = true
